name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Build, test and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` compiles with -Werror, runs the tests and fails below the
      # coverage threshold configured in the pom.
      - name: Maven verify
        run: mvn -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore

  kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render and validate against the Kubernetes schemas
        run: |
          kubectl kustomize k8s > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary - < rendered.yaml

  image:
    name: Build, smoke test, scan and publish the image
    needs: [test, kubernetes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ledger:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the running container
        run: |
          docker run -d --name ledger -p 8080:8080 ledger:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health
          curl -fsS -X POST http://localhost:8080/deployments \
            -H 'Content-Type: application/json' \
            -d '{"service":"smoke","version":"0.0.1","environment":"ci","status":"SUCCEEDED"}'
          curl -fsS 'http://localhost:8080/deployments?service=smoke' | grep -q '"service":"smoke"'
          # The container must not run as root.
          test "$(docker exec ledger id -u)" != "0"

      - name: Show container logs on failure
        if: failure()
        run: docker logs ledger || true

      - name: Scan the image for known vulnerabilities
        # Pinned to a commit: a third-party action should not be a mutable tag. Dependabot updates it.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ledger:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
